  create-release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Get version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generate changelog for release
        run: pnpm generate-changelog

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract release notes
        id: extract_notes
        shell: bash
        run: |
          if [ -f "data/changelog.json" ]; then
            NOTES=$(node -e "
              const fs = require('fs');
              try {
                const changelog = JSON.parse(fs.readFileSync('data/changelog.json', 'utf-8'));
                const latestRelease = changelog.releases[0];
                if (latestRelease) {
                  let notes = '## ' + (latestRelease.version === 'unreleased' ? 'Próxima Versão' : 'v' + latestRelease.version) + '\\n\\n';
                  notes += '**Data:** ' + latestRelease.date + '\\n\\n';
                  notes += '### Mudanças\\n\\n';
                  latestRelease.commits.forEach(commit => {
                    const icon = commit.type === 'feat' ? '✨' : '🐛';
                    notes += '- ' + icon + ' **' + (commit.type === 'feat' ? 'Nova Funcionalidade' : 'Correção') + ':** ' + commit.message + '\\n';
                  });
                  console.log(notes);
                } else {
                  console.log('## Release ${{ steps.get_version.outputs.version }}');
                }
              } catch (e) {
                console.log('## Release ${{ steps.get_version.outputs.version }}');
              }
            ")
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            echo "$NOTES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=## Release ${{ steps.get_version.outputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          body: |
            ${{ steps.extract_notes.outputs.notes }}
            
            ## Downloads
            
            Baixe o instalador para sua plataforma nos assets abaixo.
          draft: false
          files: artifacts/**/*
          generate_release_notes: false

